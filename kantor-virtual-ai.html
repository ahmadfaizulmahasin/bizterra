<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: satu layar. Kiri = panggung 3D (kantor isometric) dengan bilah perintah di atas dan kontrol di bawah. Kanan = panel agen / aktivitas. Di HP panel pindah ke bawah. */
:root{
  --bg:#edf0f5; --surface:#ffffff; --surface-2:#f2f4f8; --ink:#141a24; --muted:#5b6575; --line:#d9dfe8;
  --accent:#2c56e8; --on-accent:#ffffff; --good:#17804a; --warn:#a96a00; --bad:#cf3550;
  --scene-bg:#e3e8f0; --scene-ground:#d2d9e5; --scene-corridor:#f1f3f8; --scene-wall:#fbfcfe; --scene-tint:0.2; --is-dark:0;
  --shadow:0 1px 2px rgba(20,26,36,.06),0 8px 24px rgba(20,26,36,.07);
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1218; --surface:#161c25; --surface-2:#1e2531; --ink:#e8ecf3; --muted:#9aa5b6; --line:#2a323f;
    --accent:#7f9aff; --on-accent:#0c1226; --good:#4cc38a; --warn:#e3aa3d; --bad:#ff7d93;
    --scene-bg:#10151d; --scene-ground:#181e29; --scene-corridor:#262e3b; --scene-wall:#323c4d; --scene-tint:0.3; --is-dark:1;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1218; --surface:#161c25; --surface-2:#1e2531; --ink:#e8ecf3; --muted:#9aa5b6; --line:#2a323f;
  --accent:#7f9aff; --on-accent:#0c1226; --good:#4cc38a; --warn:#e3aa3d; --bad:#ff7d93;
  --scene-bg:#10151d; --scene-ground:#181e29; --scene-corridor:#262e3b; --scene-wall:#323c4d; --scene-tint:0.3; --is-dark:1;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; padding-block:12px; overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--bg); color:var(--ink); font:14px/1.45 var(--font-body);
}
button,input{font-family:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
#app{height:100%; display:grid; grid-template-rows:auto minmax(0,1fr); gap:10px}

.top{display:flex; align-items:center; justify-content:space-between; gap:8px 16px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:10px}
.mark{width:26px; height:26px; flex:none}
.brand h1{margin:0; font:700 20px/1 var(--font-display); letter-spacing:-.01em}
.brand small{font:500 11px var(--font-mono); color:var(--muted); letter-spacing:.06em; text-transform:uppercase; padding-left:10px; border-left:1px solid var(--line)}
.stats{display:flex; flex-wrap:wrap; gap:4px 14px; font-size:12.5px; color:var(--muted)}
.stats span{display:inline-flex; align-items:center; gap:6px; white-space:nowrap}
.dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--c,var(--muted)); flex:none}
.st-idle{--c:var(--muted)} .st-thinking{--c:var(--warn)} .st-working{--c:var(--accent)} .st-done{--c:var(--good)} .st-help{--c:var(--bad)}

main{display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:12px; min-height:0}
.stage{position:relative; min-height:0; border-radius:14px; overflow:hidden; background:var(--scene-bg); border:1px solid var(--line)}
#gl{position:absolute; inset:0}
#gl canvas{display:block; width:100%; height:100%; touch-action:none; cursor:grab}
.gl-fail{margin:0; height:100%; display:grid; place-items:center; padding:24px; text-align:center; color:var(--muted)}

.ovl-top{position:absolute; top:10px; left:10px; right:10px; display:flex; flex-direction:column; gap:8px; pointer-events:none; max-width:640px}
.ovl-top>*{pointer-events:auto}
.cmd{display:flex; gap:8px}
.cmd input{box-shadow:var(--shadow)}
input[type=text]{flex:1; min-width:0; font-size:14px; padding:9px 12px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink)}
input[type=text]::placeholder{color:var(--muted)}
.chips{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; font-size:12px; font-weight:500; padding:6px 11px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.btn{font-size:13px; font-weight:500; padding:8px 13px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent); color:var(--on-accent); border-color:transparent}
.btn.primary:hover{filter:brightness(1.08); background:var(--accent)}

.ovl-bottom{position:absolute; left:10px; right:10px; bottom:10px; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; pointer-events:none}
.ovl-bottom>*{pointer-events:auto}
.dock-group{display:flex; flex-wrap:wrap; align-items:center; gap:8px}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--surface)}
.seg button{padding:6px 11px; border:0; background:transparent; font:500 12px var(--font-mono); color:var(--muted); cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent)}
.toggle{display:inline-flex; align-items:center; gap:7px; padding:6px 10px; border:1px solid var(--line); border-radius:10px; background:var(--surface); font-size:12px; cursor:pointer}
.toggle input{margin:0; accent-color:var(--accent)}
.hint{font-size:11.5px; color:var(--muted); background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:6px 10px}
.toast{position:absolute; left:50%; transform:translateX(-50%); bottom:58px; max-width:calc(100% - 24px); background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:10px; font-size:13px; text-align:center; box-shadow:var(--shadow)}

.panel{display:flex; flex-direction:column; min-height:0; background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); overflow:hidden}
.tabs{display:flex; border-bottom:1px solid var(--line)}
.tabs button{flex:1; padding:11px 12px; border:0; border-bottom:2px solid transparent; background:transparent; color:var(--muted); font-size:13px; font-weight:600; cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}
.count{display:inline-block; min-width:18px; padding:0 5px; margin-left:4px; border-radius:99px; background:var(--accent); color:var(--on-accent); font:500 11px/18px var(--font-mono); text-align:center}
.view{flex:1; min-height:0; overflow:auto; padding:14px}
.lead{margin:0 0 10px; color:var(--muted); font-size:13px}
.agent-list{list-style:none; margin:0; padding:0; display:grid; gap:2px}
.agent-row{display:grid; grid-template-columns:36px minmax(0,1fr) auto; gap:10px; align-items:center; width:100%; padding:8px; border:0; border-radius:10px; background:transparent; color:inherit; text-align:left; cursor:pointer}
.agent-row:hover{background:var(--surface-2)}
.agent-row b{display:block; font-size:13.5px}
.agent-row small{display:block; color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.avatar{width:36px; height:36px; border-radius:10px; display:grid; place-items:center; font:700 12px var(--font-display); letter-spacing:.02em}
.pill{display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:99px; background:var(--surface-2); border:1px solid var(--line); font-size:11.5px; font-weight:500; white-space:nowrap}
.link{border:0; background:transparent; color:var(--accent); font-size:13px; font-weight:500; padding:0 0 10px; cursor:pointer}
.d-head{display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:12px; align-items:center; margin-bottom:12px}
.d-head .avatar{width:44px; height:44px; border-radius:12px; font-size:14px}
.d-head h2{margin:0; font:700 18px/1.15 var(--font-display)}
.d-head p{margin:2px 0 0; color:var(--muted); font-size:12.5px}
.d-task{background:var(--surface-2); border-radius:10px; padding:10px 12px; margin-bottom:12px}
.d-task p{margin:0 0 8px; font-size:13px; overflow-wrap:anywhere}
.bar{height:6px; border-radius:99px; background:var(--line); overflow:hidden}
.bar i{display:block; height:100%; width:0; background:var(--accent); transition:width .25s}
.approval{border:1px solid var(--bad); border-radius:10px; padding:10px 12px; margin-bottom:12px}
.approval p{margin:0 0 8px; font-size:13px}
.row{display:flex; gap:8px}
.panel h3{margin:16px 0 6px; font:600 11px var(--font-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.chips.small{flex-wrap:wrap; overflow:visible; margin-top:8px}
.history{list-style:none; margin:0; padding:0}
.history li{padding:8px 0; border-bottom:1px solid var(--line); font-size:13px}
.history li small{display:block; color:var(--muted); font-size:12px; overflow-wrap:anywhere}
.history time,.feed time{font:400 11.5px var(--font-mono); color:var(--muted)}
.feed{list-style:none; margin:0; padding:0}
.feed-item{display:grid; grid-template-columns:auto 8px minmax(0,1fr); gap:8px; align-items:baseline; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px}
.feed-item p{margin:0; overflow-wrap:anywhere}
.feed-item.result{display:block; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:8px 0}
.feed-item.result h4{margin:0 0 6px; font:700 14px var(--font-display); overflow-wrap:anywhere}
.feed-item.result ul{margin:0; padding-left:16px; display:grid; gap:4px}
.feed-item.result li{font-size:12.5px; overflow-wrap:anywhere}
.empty{color:var(--muted); font-size:13px}

@media (max-width:860px){
  main{grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,1fr) minmax(0,44%)}
  .brand small{display:none}
  .hint{display:none}
}
@media (max-width:480px){
  .ovl-top{top:8px; left:8px; right:8px}
  .ovl-bottom{left:8px; right:8px; bottom:8px}
  .toast{bottom:92px}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<div id="app">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 21 7v10l-9 5-9-5V7z" fill="var(--accent)"/><path d="M12 12 21 7M12 12v10M12 12 3 7" stroke="var(--surface)" stroke-width="1.4" fill="none" stroke-linejoin="round"/></svg>
      <h1>Kantor Virtual AI</h1>
      <small>Prototipe Tahap 1</small>
    </div>

  <main>
    <section class="stage" aria-label="Kantor 3D">

      <div class="ovl-top">
        <form class="cmd" id="cmdForm" autocomplete="off">
          <label class="sr" for="cmd">Perintah untuk Manager</label>

      <div class="ovl-bottom">
        <div class="dock-group">
          <div class="seg" role="group" aria-label="Kecepatan simulasi" id="speed">
            <button type="button" data-speed="1" aria-pressed="false">1x</button>
            <button type="button" data-speed="2" aria-pressed="true">2x</button>
            <button type="button" data-speed="4" aria-pressed="false">4x</button>
          </div>
          <label class="toggle" for="needApproval"><input type="checkbox" id="needApproval">Minta persetujuan sebelum posting</label>
        </div>
        <div class="dock-group">
          <span class="hint">Seret: putar · Gulir: zoom · Klik agen: detail</span>
          <button class="btn" type="button" id="overviewBtn">Lihat semua</button>
        </div>
      </div>
      <div class="toast" id="toast" hidden></div>
    </section>
    <aside class="panel">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tabAgents" aria-selected="true" aria-controls="viewAgents">Agen</button>
        <button type="button" role="tab" id="tabFeed" aria-selected="false" aria-controls="viewFeed">Aktivitas <span class="count" id="unread" hidden>0</span></button>
      </div>
      <div class="view" id="viewAgents" role="tabpanel" aria-labelledby="tabAgents">
        <div id="overview">
          <p class="lead">Klik agen di kantor atau di daftar ini untuk melihat tugas, memberi perintah, dan membaca riwayatnya.</p>
          <ul class="agent-list" id="agentList"></ul>
        </div>
        <div id="detail" hidden>
          <button type="button" class="link" id="backBtn">← Semua agen</button>
          <div class="d-head">
            <span class="avatar" id="dAvatar"></span>
            <div><h2 id="dName"></h2><p id="dRole"></p></div>
            <span class="pill" id="dPill"></span>
          </div>
          <div class="d-task"><p id="dTask"></p><div class="bar"><i id="dBar"></i></div></div>
          <div class="approval" id="dApproval" hidden>
            <p id="dApprovalText"></p>
            <div class="row"><button type="button" class="btn primary" id="apprYes">Setujui</button><button type="button" class="btn" id="apprNo">Tolak</button></div>
          </div>
          <form id="dForm" autocomplete="off">
            <label class="sr" for="dInput">Tugas untuk agen ini</label>
            <div class="row"><input id="dInput" type="text" maxlength="120" placeholder="Beri tugas langsung"><button class="btn primary" type="submit">Kirim</button></div>
          </form>
          <div class="chips small" id="dQuick"></div>
          <h3>Riwayat</h3>
          <ul class="history" id="dHistory"></ul>
        </div>
      </div>
      <div class="view" id="viewFeed" role="tabpanel" aria-labelledby="tabFeed" hidden>
        <p class="empty" id="feedEmpty">Belum ada aktivitas.</p>
        <ol class="feed" id="feed"></ol>
      </div>
    </aside>
  </main>
</div>

var raycaster=new THREE.Raycaster(),ndc=new THREE.Vector2();

  var r=dom.getBoundingClientRect(); ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  raycaster.setFromCamera(ndc,cam);
  var hits=raycaster.intersectObjects(pickables,false);
  return hits.length?hits[0].object.userData.agentId:null;
}
var pts=new Map(),pinch0=0,moved=false,downAt=null,hoverBusy=false;

/* ---------- waktu simulasi dan gerak ---------- */
var simT=0,realT=0,timeScale=2,waiters=[];

function walk(a,pts2){
  var v=pts2.map(function(p){return new THREE.Vector3(p[0],0,p[1]);});
  a.walkP=a.walkP.then(function(){return new Promise(function(res){a.walk={pts:v,i:0,res:res};});});

function exitPath(a){
  if(a.row===0)return [[a.cx-1.9,a.cz-0.7],[a.cx-1.9,-1.5],[a.cx,-1.5],[a.cx,0]];
  return [[a.cx,1.5],[a.cx,0]];
}
function doorIn(a){return a.row===0?[a.cx,-1.5]:[a.cx,1.5];}
function routePath(f,t){var p=exitPath(f).slice(); if(t.cx!==f.cx)p.push([t.cx,0]); p.push(doorIn(t)); return p;}

var EYE={idle:0x9bffe0,thinking:0xffd166,working:0x9bffe0,done:0x7dff9b,help:0xff6b81};
function updateAgent(a,dt,sdt){
  var g=a.group,t=realT+a.phase,moving=false;
  if(a.walk){
    var w=a.walk,tg=w.pts[w.i],dx=tg.x-g.position.x,dz=tg.z-g.position.z,d=Math.hypot(dx,dz),step=4.6*sdt;
    if(d<=step){g.position.x=tg.x; g.position.z=tg.z; w.i++; if(w.i>=w.pts.length){var rs=w.res; a.walk=null; rs();}}
    else{g.position.x+=dx/d*step; g.position.z+=dz/d*step; a.yawT=Math.atan2(dx,dz); moving=true;}
  }
  a.yaw=lerpAngle(a.yaw,moving?a.yawT:az,Math.min(1,dt*9)); g.rotation.y=a.yaw;
  var y=BASEY,L=0,R=0,tilt=0,hz=0,st=a.status;
  if(moving){y+=Math.abs(Math.sin(t*9))*0.07*amp; tilt=0.1; var sw=Math.sin(t*9)*0.7*amp; if(a.carry){L=-1.15;R=-1.15;}else{L=sw;R=-sw;}}
  else if(st==='working'){y+=Math.sin(t*3)*0.015*amp; L=-1.5+Math.sin(t*20)*0.16*amp; R=-1.5+Math.sin(t*20+3.14)*0.16*amp; tilt=0.06; hz=Math.sin(t*2)*0.03;}
  else if(st==='thinking'){y+=Math.sin(t*2)*0.03*amp; L=-0.15; R=-2.35+Math.sin(t*3)*0.08*amp; hz=Math.sin(t*2.2)*0.2*amp;}
  else if(st==='done'){var k=clamp(1-(simT-a.doneAt)/1.4,0,1); y+=Math.abs(Math.sin(t*7))*0.14*k*amp; L=-2.7*k; R=-2.7*k;}
  else if(st==='help'){y+=Math.abs(Math.sin(t*5))*0.06*amp; R=-2.9+Math.sin(t*9)*0.45*amp; L=0.15; hz=Math.sin(t*6)*0.12*amp;}
  else{y+=Math.sin(t*1.5)*0.03*amp; L=Math.sin(t*1.3)*0.05; R=-L;}
  var k2=Math.min(1,dt*12);
  a.armL.rotation.x+=(L-a.armL.rotation.x)*k2; a.armR.rotation.x+=(R-a.armR.rotation.x)*k2;
  a.headG.rotation.z+=(hz-a.headG.rotation.z)*k2; a.body.rotation.x+=(tilt-a.body.rotation.x)*k2;
  g.position.y=y; a.doc.visible=a.carry;
  if(a.pulse>0){a.pulse=Math.max(0,a.pulse-dt*1.6); g.scale.setScalar(1+Math.sin(a.pulse*Math.PI)*0.14);} else g.scale.setScalar(1);
  if(a.work){var p=(simT-a.work.t0)/a.work.dur; a.progress=clamp(p,0,1); if(p>=1){var r2=a.work.r; a.work=null; r2();}}
  a.eyeMat.color.setHex(EYE[st]); a.ballMat.color.setHex(EYE[st]);
  a.ring.position.x=g.position.x; a.ring.position.z=g.position.z;
  var ro=(selected===a)?0.9:(hoverId===a.id?0.45:0); a.ring.material.opacity+=(ro-a.ring.material.opacity)*Math.min(1,dt*10);
  a.holo.rotation.y=az;
  var key=st+'|'+Math.round(a.progress*25);
  a.stSprite.visible=st!=='idle';
  if(key!==a.key){a.key=key; if(st!=='idle')drawStatus(a);}
  else if(st==='thinking'&&Math.floor(realT*3)!==a.dotTick){a.dotTick=Math.floor(realT*3); drawStatus(a);}
  var hk=st+'|'+(st==='working'?Math.round(a.progress*40)+'|'+Math.floor(realT*5):'');
  if(hk!==a.holoKey){a.holoKey=hk; drawHolo(a);}
}

var toastEl=$('#toast'),toastTimer=0;

var statsEl=$('#stats'),pending=0,running=false;

var dName=$('#dName'),dRole=$('#dRole'),dPill=$('#dPill'),dTask=$('#dTask'),dBar=$('#dBar'),dAv=$('#dAvatar'),dHist=$('#dHistory'),dAppr=$('#dApproval'),dApprText=$('#dApprovalText'),histN=-1,histFor=null;

function select(id){

  if(selected){

[['Konten promo','Buat konten promo diskon akhir tahun'],['Komplain pelanggan','Balas komplain pelanggan soal pengiriman terlambat'],['Laporan mingguan','Buat laporan performa minggu ini'],['Edit video','Edit video unboxing produk baru']].forEach(function(c){

function submitCommand(text){
  if(pending>0)toast('Perintah masuk antrean'); else toast('Manager menerima perintah');
  enqueue(function(){return runPipeline(text,false);});
}
function sendTo(a,text){
  if(a.id==='manager'){submitCommand(text);return;}
  toast(pending>0?'Tugas masuk antrean':a.name+' menerima tugas');
  enqueue(function(){return runSingle(a,text);});
}

/* ---------- alur kerja ---------- */
var queue=Promise.resolve();
function enqueue(fn){
  pending++; updateStats();
  queue=queue.then(function(){running=true; return fn();}).catch(function(e){console.error(e);}).then(function(){running=false; pending--; markDirty();});
}
function planFor(text){
  var t=text.toLowerCase();
  if(/komplain|keluhan|pelanggan|customer|refund|\bcs\b|retur/.test(t))return ['cs'];
  if(/laporan|analisa|analisis|performa|statistik|data/.test(t))return ['data'];
  if(/jadwal|posting|upload|unggah/.test(t)&&!/konten|video|promo|kampanye/.test(t))return ['sosmed'];
  if(/video|reels|tiktok|edit/.test(t)&&!/promo|kampanye/.test(t))return ['content','video','sosmed'];
  return ['content','video','sosmed','data'];
}
async function handoff(from,to){
  var route=routePath(from,to);
  from.carry=true; log(from,'Membawa hasil ke '+to.name,'move');
  await walk(from,route);
  from.carry=false; to.pulse=1; setStatus(from,'idle','');
  var back=route.slice(0,-1).reverse(); back.push([from.home.x,from.home.z]);
  walk(from,back);
}
function askApproval(a,text){
  return new Promise(function(res){a.approval={text:text,res:res}; select(a.id); toast(a.name+' menunggu persetujuan Anda'); markDirty();});
}
function answerApproval(ok){var a=selected; if(a&&a.approval){var r=a.approval.res; a.approval=null; markDirty(); r(ok);}}
async function runStep(a,topic,outs){
  await a.walkP;
  setStatus(a,'thinking',LBL[a.id].think); await sleep(800+Math.random()*500);
  await workFor(a,LBL[a.id].work,2400+Math.random()*1800);
  if(a.id==='sosmed'&&$('#needApproval').checked){
    setStatus(a,'help','Butuh persetujuan untuk memposting'); log(a,'Menunggu persetujuan sebelum memposting','help');
    var ok=await askApproval(a,'Jadwal posting sudah siap: Instagram 19:00, TikTok 19:30, Facebook 20:00. Lanjutkan?');
    if(!ok){outs.push({name:a.name,res:'Posting dibatalkan oleh pengguna.'}); log(a,'Posting dibatalkan oleh pengguna','help'); setStatus(a,'idle',''); return false;}
    await workFor(a,'Memposting konten',1200);
  }
  var res=RES[a.id](topic);
  a.history.unshift({task:topic,res:res,time:clock()}); if(a.history.length>8)a.history.pop();
  outs.push({name:a.name,res:res}); log(a,'Selesai: '+res,'done'); setStatus(a,'done',res);
  return true;
}
async function runPipeline(text,isDemo){
  var mgr=A.manager,t0=simT,outs=[],steps=planFor(text),topic=short(text,44),cancelled=false;
  log(mgr,(isDemo?'Contoh perintah awal: “':'Menerima perintah: “')+topic+'”','task');
  await mgr.walkP;
  setStatus(mgr,'thinking',LBL.manager.think); await sleep(1100);
  log(mgr,'Rencana kerja: '+steps.map(function(id){return A[id].name;}).join(' → '),'plan');
  var holder=mgr;
  for(var i=0;i<steps.length;i++){
    var a=A[steps[i]];
    await handoff(holder,a);
    var ok=await runStep(a,topic,outs);
    holder=a;
    if(!ok){cancelled=true;break;}
  }
  await handoff(holder,mgr);
  setStatus(mgr,'done',cancelled?'Tugas dihentikan':'Tugas selesai');
  log(mgr,(cancelled?'Tugas dihentikan':'Semua langkah selesai')+' (±'+Math.round(simT-t0)+' dtk kerja agen)','done');
  addResult(topic,outs,cancelled);
  toast(cancelled?'Tugas dihentikan. Lihat tab Aktivitas.':'Tugas selesai. Hasilnya ada di tab Aktivitas.');
  await sleep(1700); setStatus(mgr,'idle','');
}
async function runSingle(a,text){
  var topic=short(text,44),outs=[];
  log(a,'Menerima tugas: “'+topic+'”','task');
  var ok=await runStep(a,topic,outs);
  addResult(topic,outs,!ok);
  toast(ok?a.name+' selesai. Hasilnya ada di tab Aktivitas.':'Tugas dibatalkan.');
  await sleep(1500); setStatus(a,'idle','');
}

/* ---------- loop ---------- */
var last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(0.05,(now-last)/1000); last=now; realT+=dt; var sdt=dt*timeScale; simT+=sdt;
  list.forEach(function(a){updateAgent(a,dt,sdt);});
  for(var i=waiters.length-1;i>=0;i--){if(simT>=waiters[i].t){var r=waiters[i].r; waiters.splice(i,1); r();}}
  var kz=Math.min(1,dt*6);
  zoom+=(zoomGoal-zoom)*kz; tgt.lerp(tgtGoal,kz);
  updateCamera(); renderer.render(scene,cam);
}
setInterval(function(){renderUI(); dirty=false;},250);
requestAnimationFrame(frame);

/* ---------- awal ---------- */
log(A.manager,'Kantor dibuka. Enam agen siap bekerja.','sys');
setTimeout(function(){enqueue(function(){return runPipeline('Buat konten promo diskon akhir tahun',true);});},1400);
})();
